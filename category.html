<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop – MarketHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏪%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="no-news">
<div id="site-header"></div>

<div class="crumbbar"><div class="wrap crumbs">
  <span id="crumbs"></span>
  <span id="found"></span>
</div></div>

<main class="wrap">
  <h1 class="ptitle" id="ptitle">Shop</h1>
  <p class="sub" id="psub"></p>

  <div class="cat-layout">
    <aside class="filters" id="filters">
      <form id="ff">
        <div class="fh"><b>☰ Filters</b><button type="button" id="clear" class="link">Clear all</button></div>
        <details open><summary>Category</summary><div id="fType"></div></details>
        <details open><summary>Price (₦)</summary>
          <div class="pr"><input id="min" type="number" min="0" placeholder="Min"><span>–</span><input id="max" type="number" min="0" placeholder="Max"></div>
          <button class="btn-outline apply">Apply</button><div id="fBucket"></div></details>
        <details open><summary>Brand</summary><div id="fBrand"></div><button type="button" id="moreBrands" class="link">See more</button></details>
        <details open><summary>Rating</summary>
          <label><input type="radio" name="rating" value="4"> <span class="stars">★★★★☆</span> &amp; up</label>
          <label><input type="radio" name="rating" value="3"> <span class="stars">★★★☆☆</span> &amp; up</label>
          <label><input type="radio" name="rating" value="2"> <span class="stars">★★☆☆☆</span> &amp; up</label>
          <label><input type="radio" name="rating" value="1"> <span class="stars">★☆☆☆☆</span> &amp; up</label></details>
        <details><summary>Discount</summary>
          <label><input type="radio" name="disc" value="10"> 10% or more</label>
          <label><input type="radio" name="disc" value="20"> 20% or more</label>
          <label><input type="radio" name="disc" value="25"> 25% or more</label></details>
        <details><summary>Seller type</summary>
          <label><input type="checkbox" name="seller" value="official"> Official Stores</label>
          <label><input type="checkbox" name="seller" value="partner"> Partner Sellers</label></details>
        <details><summary>Delivery</summary>
          <label><input type="checkbox" name="free" value="1"> Free Delivery</label></details>
      </form>
    </aside>

    <section>
      <div class="bar">
        <button id="fToggle" class="fbtn" type="button">☰ Filters</button>
        <span id="showing"></span>
        <div class="sort">Sort by:
          <select id="sort">
            <option value="pop">Popularity</option><option value="asc">Price: Low to High</option>
            <option value="desc">Price: High to Low</option><option value="new">Newest</option>
            <option value="rate">Top Rated</option><option value="disc">Biggest Discount</option>
          </select>
          <div class="vt"><button id="vGrid" class="on" aria-label="Grid view">▦</button><button id="vList" aria-label="List view">☰</button></div>
        </div>
      </div>
      <div id="pgrid" class="grid pg"></div>
      <div class="pager" id="pager"></div>
      <p class="viewed" id="viewed"></p>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/phones.js"></script>
<script src="js/accessories.js"></script>
<script src="js/app.js"></script>
<script src="js/category.js"></script>
</body>
</html>
