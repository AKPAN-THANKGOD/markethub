<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping Cart – MarketHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏪%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="no-news">
<div id="site-header"></div>

<div class="crumbbar"><div class="wrap crumbs"><span><a href="index.html">Home</a> › <b>Shopping Cart</b></span></div></div>

<main class="wrap">
  <div class="cart-top">
    <div><h1 class="ptitle">Shopping Cart</h1><p class="sub" id="sub"></p></div>
    <a href="index.html" class="link">Continue Shopping →</a>
  </div>

  <div class="cart-layout" id="layout">
    <div><div id="groups"></div><section id="savedBox" class="cg" hidden></section></div>
    <aside class="summary" id="summary"></aside>
  </div>

  <div id="empty" class="box emptycart" hidden>
    <div class="big">🛒</div><h2>Your cart is empty</h2>
    <p>Browse our deals and add something you love.</p>
    <a href="index.html" class="btn">Start Shopping</a>
    <section id="savedEmpty" class="cg" hidden style="text-align:left;margin-top:24px"></section>
  </div>

  <h2 class="fbt-h">Frequently Bought Together</h2>
  <div id="fbtGrid" class="grid"></div>
</main>

<div id="site-footer"></div>
<script src="js/phones.js"></script>
<script src="js/accessories.js"></script>
<script src="js/app.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
