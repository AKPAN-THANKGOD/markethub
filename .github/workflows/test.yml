name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  # 1) The website, tested in a real browser
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 7

  # 2) The PHP + MySQL backend, tested against a real database
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Check PHP syntax
        run: find api db -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Point the API at the test database
        run: |
          cat > api/config.local.php <<'EOF'
          <?php
          return [
              'db' => ['host' => '127.0.0.1', 'port' => 3306, 'name' => 'markethub', 'user' => 'root', 'pass' => 'root'],
              'debug' => true,
              'allowed_origin' => '',
              'admin_emails' => ['ci-admin@example.com'],
          ];
          EOF
      - name: Create the database and load the products
        run: |
          command -v mysql >/dev/null || (sudo apt-get update && sudo apt-get install -y mysql-client)
          mysql --show-warnings -h 127.0.0.1 -P 3306 -uroot -proot < db/schema.sql
          mysql --show-warnings -h 127.0.0.1 -P 3306 -uroot -proot markethub < db/seed.sql
      - name: Check the data really loaded
        run: |
          echo "seed.sql in the repo: $(wc -c < db/seed.sql) bytes, $(grep -c '^INSERT' db/seed.sql) INSERT statements (expected about 10000 bytes, 4 statements)"
          for t in categories sellers products promo_codes; do
            echo "$t: $(mysql -N -B -h 127.0.0.1 -P 3306 -uroot -proot markethub -e "SELECT COUNT(*) FROM $t" 2>/dev/null)"
          done
          test "$(mysql -N -B -h 127.0.0.1 -P 3306 -uroot -proot markethub -e 'SELECT COUNT(*) FROM products' 2>/dev/null)" -ge 56
      - run: npx playwright install --with-deps chromium
      # Round 1: payments switched ON, talking to a fake Paystack that tests/pay.spec.js starts on port 9911
      - name: Start the PHP server (payments on)
        run: |
          PHP_CLI_SERVER_WORKERS=4 nohup php -S localhost:8000 > php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health.php && break || sleep 1; done
          curl -fs http://localhost:8000/api/health.php
        env:
          PAYSTACK_SECRET_KEY: sk_test_ci_secret
          PAYSTACK_BASE_URL: http://127.0.0.1:9911
      - name: Run the API, payment and admin tests
        run: npx playwright test tests/api.spec.js tests/pay.spec.js tests/admin.spec.js
        env:
          API_BASE: http://localhost:8000
          API_ONLY: '1'
          PAYSTACK_SECRET_KEY: sk_test_ci_secret
          PAYSTACK_BASE_URL: http://127.0.0.1:9911
          ADMIN_EMAIL: ci-admin@example.com
      # Round 2: payments OFF (no key), so the existing shopping journey still ends in a "pending" card order
      - name: Restart the PHP server (payments off)
        run: |
          pkill -f "php -S" || true
          sleep 1
          PHP_CLI_SERVER_WORKERS=4 nohup php -S localhost:8000 >> php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health.php | grep -q '"payments":false' && break || sleep 1; done
          curl -fs http://localhost:8000/api/health.php
      - name: Run the browser tests against the real backend
        run: npx playwright test tests/e2e.spec.js
        env:
          E2E_BASE: http://localhost:8000
          E2E_EXPECT_MODE: api
          API_ONLY: '1'
      - name: Show the PHP server log
        if: failure()
        run: cat php-server.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-report
          path: playwright-report/
          retention-days: 7